<html>

<head>

<title> Registration Form</title>
<link rel="stylesheet" href="Registreation.css">
<script>

function login()
    
{

var name= document.getElementById("name").value;

var email= document.getElementById("email").value;

var address =document.getElementById("address").value;

var number=document.getElementById("number").value;

localStorage.setItem("name", name);

localStorage.setItem("email",email);

localStorage.setItem("address", address);

localStorage.setItem("number",number);
return;
}
</script>

</head>

<body>

<h1>Registrtion Form</h1>

<form action="deatailes.html">

Name <input type="text" id="name"/><br><br>

Email ID <input type="email" id="email"/><br><br>

Address <input type="text" id="address"/><br><br>

NUMBER  <input type="number" id="number"/><br><br>

<input type="submit" value="submit" onclick="login()">

</form>

</body>

</html>
